[package]
name = "lfu-light"
version = "0.1.1"
edition = "2024"
authors = ["Graham Keenan <graham.keenan@outlook.com>"]
license = "MIT OR Apache-2.0"

readme = "README.md"
description = "Lightweight Least Frequently Used Cache implementation"
repository = "https://github.com/Tyrannican/lfu-light"

keywords = ["lfu", "cache"]
categories = ["data-structures"]

rust-version = "1.85.0" # Hashbrown limited

[dependencies]
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.10.0"
rand_distr = "0.6.0"

[[bench]]
name = "lfu_light"
harness = false
